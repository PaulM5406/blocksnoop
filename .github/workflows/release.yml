name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci-check:
    name: Verify CI passed
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow to pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=${{ github.sha }}
          echo "Waiting for CI to complete on $SHA..."
          for i in $(seq 1 30); do
            STATUS=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs" \
              --jq ".workflow_runs[] | select(.head_sha == \"$SHA\") | .conclusion" | head -1)
            if [ "$STATUS" = "success" ]; then
              echo "CI passed!"
              exit 0
            elif [ "$STATUS" = "failure" ] || [ "$STATUS" = "cancelled" ]; then
              echo "::error::CI workflow failed for commit $SHA (status: $STATUS)"
              exit 1
            fi
            echo "Attempt $i/30: CI status is '${STATUS:-pending}', waiting 30s..."
            sleep 30
          done
          echo "::error::Timed out waiting for CI to pass (15 minutes)"
          exit 1

  build:
    name: Build packages
    needs: [ci-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Verify tag matches package version
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME#v}" = "$VERSION"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  smoke-pypi:
    name: Test published PyPI artifacts
    needs: [publish]
    runs-on: ubuntu-latest
    env:
      VENV: /tmp/blocksnoop-pypi-smoke
    steps:
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Wait for exact version and verify uploaded hashes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION=${VERSION#v}
          for i in $(seq 1 20); do
            set +e
            VERSION="$VERSION" python - <<'PY'
          import glob
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request

          version = os.environ["VERSION"]
          try:
              with urllib.request.urlopen(
                  f"https://pypi.org/pypi/blocksnoop/{version}/json", timeout=10
              ) as response:
                  metadata = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code == 404 or error.code == 408 or error.code == 429 or error.code >= 500:
                  raise SystemExit(75)
              raise SystemExit(f"PyPI JSON API returned HTTP {error.code}: {error.reason}")
          except (urllib.error.URLError, TimeoutError, json.JSONDecodeError):
              raise SystemExit(75)

          remote = {
              item["filename"]: item["digests"]["sha256"] for item in metadata["urls"]
          }
          local = {}
          for path in glob.glob("dist/*"):
              filename = os.path.basename(path)
              local[filename] = hashlib.sha256(open(path, "rb").read()).hexdigest()

          if local.keys() != remote.keys():
              raise SystemExit(
                  "PyPI artifact filenames differ: "
                  f"local={sorted(local)} remote={sorted(remote)}"
              )
          for filename, digest in local.items():
              if remote[filename] != digest:
                  raise SystemExit(
                      f"PyPI hash mismatch for {filename}: "
                      f"local={digest} remote={remote[filename]}"
                  )
          PY
            STATUS=$?
            set -e
            if [ "$STATUS" = 0 ]; then
              break
            fi
            if [ "$STATUS" != 75 ]; then
              echo "::error::PyPI artifacts for $VERSION do not match local dist"
              exit "$STATUS"
            fi
            if [ "$i" = 20 ]; then
              echo "::error::blocksnoop $VERSION did not propagate to the PyPI JSON API"
              exit 1
            fi
            echo "Attempt $i/20: PyPI JSON API is not ready, waiting 15s..."
            sleep 15
          done
      - name: Install from PyPI outside the checkout
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION=${VERSION#v}
          uv venv --clear --python 3.12 "$VENV"
          for i in $(seq 1 20); do
            if uv pip install --no-cache --index-url https://pypi.org/simple \
              --python "$VENV/bin/python" "blocksnoop==$VERSION"; then
              break
            fi
            if [ "$i" = 20 ]; then
              echo "::error::blocksnoop $VERSION is not installable from the PyPI Simple Index"
              exit 1
            fi
            echo "Attempt $i/20: blocksnoop $VERSION is not installable from the"
            echo "Simple Index yet; waiting 15s..."
            sleep 15
          done
          cd /tmp
          VERSION="$VERSION" \
            "$VENV/bin/python" - <<'PY'
          import os
          from importlib.metadata import version
          from importlib.resources import files

          expected = os.environ["VERSION"]
          root = files("blocksnoop")
          assert version("blocksnoop") == expected
          assert root.joinpath("bpf/blockdetect.c").is_file()
          assert root.joinpath("bpf/core_blockdetect.bpf.c").is_file()
          assert root.joinpath("bpf/core_types.h").is_file()
          PY
          "$VENV/bin/blocksnoop" --help
          "$VENV/bin/python" - <<'PY'
          import glob
          import os
          import tarfile

          archives = glob.glob(
              os.path.join(os.environ["GITHUB_WORKSPACE"], "dist", "*.tar.gz")
          )
          assert len(archives) == 1, (
              f"expected one source distribution, found: {archives}"
          )
          with tarfile.open(archives[0]) as archive:
              assert any(
                  member.isfile()
                  and member.name.endswith("/native/blocksnoop_ebpf.c")
                  for member in archive.getmembers()
              ), "source distribution is missing native/blocksnoop_ebpf.c"
          PY
      - name: Verify wheel-only Core diagnostics fail cleanly
        run: |
          set +e
          "$VENV/bin/blocksnoop" doctor \
            --backend core --json >/tmp/blocksnoop-doctor-report.json \
            2>/tmp/blocksnoop-doctor-stderr
          STATUS=$?
          set -e
          test "$STATUS" = 1
          if ! "$VENV/bin/python" - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/blocksnoop-doctor-report.json").read_text())
          assert report["effective_backend"] is None
          sidecar = next(check for check in report["checks"] if check["name"] == "sidecar")
          assert sidecar["status"] == "fail"
          PY
          then
            echo "::error::blocksnoop doctor did not emit a valid JSON report" >&2
            cat /tmp/blocksnoop-doctor-stderr >&2
            exit 1
          fi
          ! grep -q Traceback /tmp/blocksnoop-doctor-stderr

  docker:
    name: Build and push Docker image
    needs: [smoke-pypi]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: oloapm/blocksnoop
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-docker:
    name: Test published Docker image
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: docker/setup-buildx-action@v3
      - name: Wait for exact multi-arch image
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION=${VERSION#v}
          IMAGE="oloapm/blocksnoop:$VERSION"
          for i in $(seq 1 20); do
            if INSPECT=$(docker buildx imagetools inspect "$IMAGE" 2>/dev/null) \
              && echo "$INSPECT" | grep -q 'Platform:.*linux/amd64' \
              && echo "$INSPECT" | grep -q 'Platform:.*linux/arm64'; then
              break
            fi
            if [ "$i" = 20 ]; then
              echo "::error::$IMAGE did not propagate to Docker Hub"
              exit 1
            fi
            sleep 15
          done
          docker pull --platform linux/amd64 "$IMAGE"
          REVISION=$(docker image inspect "$IMAGE" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          test "$REVISION" = "$GITHUB_SHA"
          PUBLISHED_IMAGE=$(docker image inspect "$IMAGE" --format '{{ index .RepoDigests 0 }}')
          echo "Published image: $PUBLISHED_IMAGE"
          echo "PUBLISHED_IMAGE=$PUBLISHED_IMAGE" >> "$GITHUB_ENV"
      - name: Smoke native and Python artifacts
        run: |
          docker run --rm "$PUBLISHED_IMAGE" sh -c \
            'blocksnoop --help >/dev/null && blocksnoop-ebpf --help >/dev/null && test -x /usr/local/bin/blocksnoop-ebpf && test -f /usr/local/lib/blocksnoop/core_blockdetect.bpf.o'
      - name: Detect a real blocking workload with Core
        run: |
          set -o pipefail
          timeout 30 docker run --rm --privileged --pid=host \
            -v /sys/kernel/debug:/sys/kernel/debug \
            "$PUBLISHED_IMAGE" blocksnoop --backend core --json -t 100 -- \
            python -c 'import asyncio,time; exec("async def main():\n for _ in range(4):\n  time.sleep(0.25)\n  await asyncio.sleep(0.05)"); asyncio.run(main())' \
            | python -c 'import json,sys; events=[item for line in sys.stdin if (item := json.loads(line)) and "duration_ms" in item]; assert events; assert all(item["duration_ms"] >= 100 for item in events); print(f"published Core events: {len(events)}")'
      - name: Detect across a private PID namespace with Core
        run: |
          uv sync --all-extras --dev
          BLOCKSNOOP_TEST_IMAGE="$PUBLISHED_IMAGE" uv run pytest \
            tests/integration/test_cross_pid_namespace.py -v -k core
